<span class="fs-badge" [ngClass]="classes" [ngStyle]="customStyles">

  <!-- dot de estado -->
  <span *ngIf="dot" class="fs-badge__dot" aria-hidden="true"></span>

  <!-- ícono izquierdo -->
  <!-- Se pinta con mask-image + currentColor, no con <img>: dentro de un <img>
       el SVG es un documento aislado, currentColor no hereda y el ícono queda
       del color que trae embebido — invisible cuando ese color coincide con el
       fondo. Enmascarado toma el color del texto del badge y sigue el tema. -->
  <span
    *ngIf="iconLeft"
    class="fs-icon fs-badge__icon fs-badge__icon--left"
    [style.--_icon]="'url(' + iconLeft + ')'"
    aria-hidden="true"
  ></span>

  <!-- label — oculto en iconOnly -->
  <span *ngIf="!iconOnly" class="fs-badge__label">
    <ng-content>{{ label }}</ng-content>
  </span>

  <!-- ícono derecho -->
  <span
    *ngIf="iconRight"
    class="fs-icon fs-badge__icon fs-badge__icon--right"
    [style.--_icon]="'url(' + iconRight + ')'"
    aria-hidden="true"
  ></span>

  <!-- botón remove -->
  <button
    *ngIf="removable"
    class="fs-badge__remove"
    type="button"
    aria-label="Remover"
    (click)="onRemove($event)"
  >
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
      <path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

</span>
