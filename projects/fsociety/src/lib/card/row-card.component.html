<div class="fs-row-card" [attr.data-tone]="tone || null">
  @if (resolvedIcon) {
    <span class="fs-row-card__icon" [attr.data-tone]="tone || null">
      <span
        class="fs-icon"
        [style.--_icon]="'url(' + resolvedIcon + ')'"
        aria-hidden="true"
      ></span>
    </span>
  }

  <div class="fs-row-card__text">
    <span class="fs-row-card__title">{{ title }}</span>
    @if (subtitle) {
      <span class="fs-row-card__subtitle">{{ subtitle }}</span>
    }
  </div>

  <div class="fs-row-card__action">
    <ng-content select="[cardAction]"></ng-content>
  </div>
</div>
