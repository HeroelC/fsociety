@if (showHeader) {
  <div class="fs-progress__header">
    @if (label) {
      <span class="fs-progress__label">{{ label }}</span>
    }
    @if (showValue && !indeterminate) {
      <span class="fs-progress__value">{{ roundedPercent }}%</span>
    }
  </div>
}

<div
  class="fs-progress__track"
  role="progressbar"
  [attr.aria-label]="label || null"
  [attr.aria-valuemin]="indeterminate ? null : 0"
  [attr.aria-valuemax]="indeterminate ? null : max"
  [attr.aria-valuenow]="indeterminate ? null : clampedValue"
>
  <div
    class="fs-progress__bar"
    [class.fs-progress__bar--indeterminate]="indeterminate"
    [style.width]="indeterminate ? null : percent + '%'"
  ></div>
</div>
