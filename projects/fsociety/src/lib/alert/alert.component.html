<div
  class="fs-alert"
  [class.fs-alert--exiting]="isExiting"
  [attr.data-tone]="tone"
  [attr.role]="tone === 'danger' ? 'alert' : 'status'"
  [attr.aria-live]="tone === 'danger' ? 'assertive' : 'polite'"
>

  <span
    class="fs-icon fs-alert__icon"
    [style.--_icon]="'url(' + iconUrl + ')'"
    aria-hidden="true"
  ></span>

  <div class="fs-alert__body">
    @if (title) {
      <div class="fs-alert__title">{{ title }}</div>
    }
    <div class="fs-alert__tx">
      <ng-content></ng-content>
    </div>
    <div class="fs-alert__actions">
      <ng-content select="[alertAction]"></ng-content>
    </div>
  </div>

  @if (dismissible) {
    <button
      class="fs-alert__close"
      type="button"
      aria-label="Cerrar"
      (click)="dismiss()"
    >
      <span
        class="fs-icon fs-alert__close-icon"
        [style.--_icon]="'url(' + Icons.x + ')'"
        aria-hidden="true"
      ></span>
    </button>
  }

  @if (autoDismiss > 0) {
    <div class="fs-alert__progress" [style.animation-duration]="progressDuration"></div>
  }

</div>
