<div
  #toaster
  class="fs-toaster"
  popover="manual"
  aria-live="polite"
  aria-label="Notificaciones"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="fs-toast" [attr.data-tone]="toast.tone" role="status">

      <span
        class="fs-icon fs-toast__icon"
        [style.--_icon]="'url(' + iconFor(toast.tone) + ')'"
        aria-hidden="true"
      ></span>

      <div class="fs-toast__body">
        @if (toast.title) {
          <div class="fs-toast__title">{{ toast.title }}</div>
        }
        @if (toast.text) {
          <div class="fs-toast__tx">{{ toast.text }}</div>
        }
      </div>

      <button
        class="fs-toast__close"
        type="button"
        aria-label="Cerrar"
        (click)="toastService.remove(toast.id)"
      >
        <span
          class="fs-icon fs-toast__close-icon"
          [style.--_icon]="'url(' + Icons.x + ')'"
          aria-hidden="true"
        ></span>
      </button>

    </div>
  }
</div>
