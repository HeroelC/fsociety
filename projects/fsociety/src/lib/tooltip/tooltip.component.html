<!--
  The listeners live on the wrapper, not the host: :host is display: contents,
  which generates no box, and mouseenter/mouseleave do not bubble — so a host
  listener would never fire.
-->
<span
  #anchor
  class="fs-tip-wrap"
  (mouseenter)="open = true"
  (mouseleave)="open = false"
  (focusin)="open = true"
  (focusout)="open = false"
  (keydown.escape)="open = false"
>
  <ng-content></ng-content>
</span>

<span
  class="fs-tip"
  role="tooltip"
  [fsAnchoredPopover]="anchor"
  [popoverOpen]="open"
  [popoverSide]="side"
  popoverAlign="center"
  [popoverMatchWidth]="false"
  [popoverOffset]="8"
>{{ label }}</span>
